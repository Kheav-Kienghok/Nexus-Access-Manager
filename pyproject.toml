[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexusctl"
version = "0.1.0"
description = "Manage Nexus projects, users and robot accounts for Docker images and the Python mirror"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
nexusctl = "nexusctl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
